# ACTIVE CONFIGURATION
# =====================================
# AWS SDK Configuration
aws.region=us-east-1

# Logging configuration
logging.level.com.focusedai.codecompiler=DEBUG
logging.level.software.amazon.awssdk=INFO

# Health check configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Enable JMX for monitoring (optional)
spring.jmx.enabled=true

# Architecture indicator
app.architecture=100% Serverless Lambda
app.execution.type=Container-based Lambda Functions