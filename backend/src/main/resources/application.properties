# Spring Boot Application Configuration
spring.application.name=code-compiler-api
server.port=8080

# Multipart file upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# CORS configuration
cors.allowed-origins=http://localhost:3000,https://your-frontend-domain.com

# =====================================
# LAMBDA FUNCTION URLS (100% Serverless)
# =====================================
# Container-based Lambda Functions
lambda.python.url=https://yep6uexg2xtpqldfgnj4xv4v4y0rvrcz.lambda-url.us-east-1.on.aws/
lambda.javascript.url=https://al26n2zynh6k5zod6doyrin66i0rkyxj.lambda-url.us-east-1.on.aws
lambda.java.url=https://xwvunfec7yql2xxqpirpa5iq440bxsjs.lambda-url.us-east-1.on.aws
lambda.cpp.url=https://jnjk22jq62wrrm3hll3n42swie0fxmun.lambda-url.us-east-1.on.aws

# Lambda timeouts (Lambda can run up to 15 minutes)
lambda.timeout.seconds=60
spring.mvc.async.request-timeout=65000

